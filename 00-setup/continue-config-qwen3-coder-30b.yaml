name: Moodle-Datenbanken lokal
version: 1.0.0
schema: v1

models:
  - name: Qwen3 Coder 30B lokal
    provider: ollama
    model: qwen3-coder:30b
    roles:
      - chat
      - edit
      - apply
    capabilities:
      - tool_use
    defaultCompletionOptions:
      temperature: 0.1
      contextLength: 32768
      maxTokens: 8192
      keepAlive: 1800
    requestOptions:
      timeout: 600000

context:
  - provider: file
  - provider: code
  - provider: diff
  - provider: terminal
