<article class="zm-db zm-single">
  <header class="zm-single-header">
    <div>
      <p class="zm-eyebrow">[[Relevanz]]</p>
      <h3>[[Titel]]</h3>
      <p class="zm-meta"><span>[[Autor]]</span><span>[[Erscheinungsjahr]]</span></p>
    </div>
    <div class="zm-actions">##actionsmenu##</div>
  </header>
  <div class="zm-single-body">
    <section class="zm-section">
      <h4>Darum ist dieses Material hilfreich</h4>
      <div class="zm-description">[[Beschreibung]]</div>
    </section>
    <section class="zm-section zm-access">
      <h4>Material öffnen</h4>
      <div class="zm-resource-links">
        <span class="zm-file">[[Datei]]</span>
        <span class="zm-link">[[Link]]</span>
      </div>
    </section>
    <section class="zm-section zm-submission">
      <h4>Beitrag</h4>
      <p>Eingereicht von: ##user##</p>
      <p>Zuletzt geändert: ##timemodified##</p>
    </section>
  </div>
</article>
