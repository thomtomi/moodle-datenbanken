<article class="ss-db ss-single">
  <header class="ss-single-header">
    <div>
      <p class="ss-eyebrow">SoSafe-Zertifikate</p>
      <h2>[[Klasse]]</h2>
    </div>
    <div class="ss-actions">##actionsmenu##</div>
  </header>
  <section class="ss-section" aria-label="Abgabestatus">
    <h3>Aktueller Abgabestatus</h3>
    <p class="ss-status" data-ss-status>[[Abgabestatus]]</p>
  </section>
  <section class="ss-section">
    <h3>Hinweis zur fehlenden Abgabe</h3>
    <div class="ss-note ss-note-detail">[[Hinweis zur fehlenden Abgabe]]</div>
  </section>
  <footer class="ss-record-meta">
    <p>Erfasst von: ##user##</p>
    <p>Zuletzt geändert: ##timemodified##</p>
  </footer>
</article>
